name: yuli_my_letters
description: "Hebrew Alphabet Learning App for Yuli - A cute interactive way to learn Hebrew letters."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SVG Support
  flutter_svg: ^2.0.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Playback
  just_audio: ^0.9.30

  # State Management
  riverpod: ^2.3.0
  flutter_riverpod: ^2.3.0

  # UI & Animations
  animations: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
       - assets/audio/
  

 